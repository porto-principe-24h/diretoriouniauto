<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mensagens Rápidas — Uniauto Brasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Uniauto palette */
  --blue:       #143c8c;
  --blue-mid:   #0078b4;
  --blue-light: #e8f0fb;
  --green:      #00783c;
  --green-light:#e6f4ee;

  /* UI surfaces */
  --bg:         #f0f4fa;
  --surface:    #ffffff;
  --surface2:   #f7f9fc;
  --border:     #dce4f0;
  --border-med: #b8c8e0;

  /* Text */
  --text:       #0d1a33;
  --text-body:  #374151;
  --muted:      #6b7a99;

  /* Status */
  --amber:      #b45309;
  --amber-bg:   #fffbeb;
  --amber-bdr:  #fcd34d;
  --red:        #b91c1c;
  --red-bg:     #fef2f2;

  box-sizing: border-box;
  padding-top:    env(safe-area-inset-top,    0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
header {
  position: sticky;
  top: env(safe-area-inset-top, 0);
  z-index: 50;
  background: var(--blue);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  height: 64px;
  box-shadow: 0 2px 12px rgba(20,60,140,.25);
}
.header-logo img {
  height: 38px;
  display: block;
  filter: brightness(0) invert(1);
}
.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}
.header-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .5px;
  color: rgba(255,255,255,.6);
  text-transform: uppercase;
}
.header-title {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
}

/* ── TOOLBAR ── */
.toolbar {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + 64px);
  z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.search-wrap {
  position: relative;
  flex: 1;
  min-width: 200px;
  max-width: 400px;
}
.search-wrap svg {
  position: absolute;
  left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
#search {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  padding: 8px 10px 8px 34px;
  border-radius: 8px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
#search:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(20,60,140,.12);
}
#search::placeholder { color: var(--muted); }

.divider { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: inherit;
  font-size: 12px; font-weight: 500;
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.filter-btn:hover { border-color: var(--blue); color: var(--blue); }
.filter-btn.active {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}

/* ── MAIN ── */
main { padding: 20px 24px 32px; }
.count {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: border-color .15s, box-shadow .15s;
}
.card:hover {
  border-color: var(--blue-mid);
  box-shadow: 0 4px 16px rgba(20,60,140,.10);
}

.card-head {
  padding: 14px 16px 12px;
  display: flex; align-items: flex-start; gap: 10px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.card-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 1px;
}
.card-title {
  font-weight: 600;
  font-size: 13px;
  line-height: 1.35;
  color: var(--text);
}
.badges { display: flex; align-items: center; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
.badge-cat {
  display: inline-block;
  background: var(--blue-light);
  color: var(--blue);
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 4px;
  letter-spacing: .3px;
}
.badge-var {
  display: inline-flex; align-items: center; gap: 3px;
  background: var(--amber-bg);
  border: 1px solid var(--amber-bdr);
  color: var(--amber);
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500;
  padding: 2px 7px;
  border-radius: 4px;
}

/* ── BODY ── */
.card-body-wrap { position: relative; flex: 1; }
.card-body {
  padding: 14px 16px;
  font-size: 13px;
  line-height: 1.75;
  color: var(--text-body);
  white-space: pre-wrap;
  word-break: break-word;
}
.card-body.collapsed {
  max-height: 130px;
  overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent);
  mask-image: linear-gradient(180deg, #000 55%, transparent);
}

/* Variable fields */
.field-group {
  padding: 0 16px 14px;
  display: flex; flex-direction: column; gap: 8px;
  border-top: 1px dashed var(--border);
}
.field-group-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--amber);
  text-transform: uppercase;
  letter-spacing: .5px;
  padding-top: 12px;
}
.var-field-row {
  display: flex; align-items: center; gap: 8px;
}
.var-field-label {
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
  min-width: 80px;
  flex-shrink: 0;
}
.var-field-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  padding: 6px 10px;
  border-radius: 6px;
  outline: none;
  transition: border-color .15s, box-shadow .15s;
}
.var-field-input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(20,60,140,.10);
}
.var-field-input::placeholder { color: var(--muted); }

/* ── FOOTER ── */
.card-foot {
  padding: 10px 16px;
  border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  background: var(--surface2);
}
.expand-btn {
  background: none; border: none;
  color: var(--muted); font-size: 11px;
  cursor: pointer; padding: 4px 0;
  font-family: inherit;
  transition: color .15s;
}
.expand-btn:hover { color: var(--blue); }

.copy-btn {
  background: var(--blue);
  border: none;
  color: #fff;
  font-family: inherit;
  font-size: 12px; font-weight: 600;
  padding: 7px 16px;
  border-radius: 7px;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  transition: all .15s;
  white-space: nowrap;
}
.copy-btn:hover { background: var(--blue-mid); }
.copy-btn.copied {
  background: var(--green);
}

/* ── EMPTY ── */
.empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
  font-size: 14px;
  grid-column: 1/-1;
}
.empty strong {
  display: block;
  font-size: 16px;
  color: var(--text);
  margin-bottom: 6px;
}

/* ── MOBILE ── */
@media (max-width: 640px) {
  header { padding: 0 16px; }
  .toolbar { padding: 10px 16px; }
  main { padding: 14px 16px 28px; }
  .grid { grid-template-columns: 1fr; }
  .search-wrap { max-width: 100%; }
  .divider { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<header>
  <div class="header-logo">
    <img id="logo-img" alt="Uniauto Brasil">
  </div>
  <div class="header-right">
    <span class="header-label">Central de Atendimento</span>
    <span class="header-title">Mensagens Rápidas</span>
  </div>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="search" type="search" placeholder="Buscar por situação, tipo ou palavra-chave…" autocomplete="off" spellcheck="false">
  </div>
  <div class="divider"></div>
  <div class="filters" id="filters">
    <button class="filter-btn active" data-cat="all">Todas</button>
    <button class="filter-btn" data-cat="reembolso">Reembolso</button>
    <button class="filter-btn" data-cat="abertura">Abertura de Evento</button>
    <button class="filter-btn" data-cat="regras">Regras / Contrato</button>
    <button class="filter-btn" data-cat="operacional">Operacional</button>
  </div>
</div>

<main>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>

    text:`Prezado(a) Associado(a),

O transporte fornecido será terrestre (ônibus), com valor limitado ao equivalente da passagem rodoviária.

Com recibo timbrado (não fiscal): desconto no valor da mensalidade.

  {
    id:14, cat:"operacional", icon:"📷", iconBg:"#ede9fe",
    title:"Solicitação de Fotos e Vídeo — Colisão", tag:"DOCUMENTAÇÃO", vars:[],
    text:`Por gentileza, encaminhe fotos do veículo e também um vídeo mostrando o veículo.

No vídeo, solicitamos que seja narrado como ocorreu a colisão, informando os detalhes do ocorrido e mostrando os danos aparentes no veículo.

Caso tenha veículo de terceiro envolvido, pedimos que o vídeo também mostre o veículo do terceiro e os danos causados, para melhor análise do evento.`
  }
];

// State
let currentCat  = 'all';
let searchTerm  = '';
let expanded    = new Set();
let fieldValues = {}; // {id: {KEY: value}}

function getFieldValues(id) {
  return fieldValues[id] || {};
}

function resolveText(m) {
  let txt = m.text;
  const vals = getFieldValues(m.id);
  m.vars.forEach(v => {
    const val = vals[v.key] || '';
    const re = new RegExp('\\[' + v.key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\]','g');
    txt = txt.replace(re, val || `[${v.key}]`);
  });
  return txt;
}

function buildCard(m) {
  const isExp  = expanded.has(m.id);
  const hasVar = m.vars.length > 0;
  const vals   = getFieldValues(m.id);

  const varBadge = hasVar
    ? `<span class="badge-var">⚡ preencher campos</span>`
    : '';

  const fieldsHtml = hasVar ? `
<div class="field-group">
  <div class="field-group-label">Preencha antes de copiar</div>
  ${m.vars.map(v => `
  <div class="var-field-row">
    <span class="var-field-label">${v.label}</span>
    <input class="var-field-input"
      type="text"
      placeholder="${v.placeholder}"
      value="${(vals[v.key]||'').replace(/"/g,'&quot;')}"
      data-id="${m.id}" data-key="${v.key}"
    >
  </div>`).join('')}
</div>` : '';

  return `
<div class="card" id="card-${m.id}" data-cat="${m.cat}"
  data-search="${m.title.toLowerCase()} ${m.text.toLowerCase()} ${m.tag.toLowerCase()}">
  <div class="card-head">
    <div class="card-icon" style="background:${m.iconBg}">${m.icon}</div>
    <div>
      <div class="card-title">${m.title}</div>
      <div class="badges">
        <span class="badge-cat">${m.tag}</span>${varBadge}
      </div>
    </div>
  </div>
  <div class="card-body-wrap">
    <div class="card-body ${isExp ? '' : 'collapsed'}" id="body-${m.id}">${escHtml(m.text)}</div>
  </div>
  ${fieldsHtml}
  <div class="card-foot">
    <button class="expand-btn" onclick="toggleExpand(${m.id})" id="expbtn-${m.id}">
      ${isExp ? '▲ Recolher' : '▼ Ver mensagem completa'}
    </button>
    <button class="copy-btn" id="copy-${m.id}" onclick="copyMsg(${m.id})">
      <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      Copiar
    </button>
  </div>
</div>`;
}

function escHtml(t){
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderAll() {
  const grid  = document.getElementById('grid');
  const count = document.getElementById('count');
  grid.innerHTML = MESSAGES.map(buildCard).join('');

  // wire up var inputs
  grid.querySelectorAll('.var-field-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const id  = parseInt(e.target.dataset.id);
      const key = e.target.dataset.key;
      if (!fieldValues[id]) fieldValues[id] = {};
      fieldValues[id][key] = e.target.value;
    });
  });

  applyFilters();
}

function applyFilters() {
  const count = document.getElementById('count');
  let visible = 0;

  MESSAGES.forEach(m => {
    const el = document.getElementById(`card-${m.id}`);
    if (!el) return;
    const catOk  = currentCat === 'all' || m.cat === currentCat;
    const termOk = !searchTerm || el.dataset.search.includes(searchTerm);
    const show = catOk && termOk;
    el.style.display = show ? '' : 'none';
    if (show) visible++;
  });

  count.textContent = `${visible} mensagem${visible !== 1 ? 's' : ''} encontrada${visible !== 1 ? 's' : ''}`;

  const empty = document.getElementById('empty-state');
  if (visible === 0 && !empty) {
    const e = document.createElement('div');
    e.id = 'empty-state'; e.className = 'empty';
    e.innerHTML = '<strong>Nenhuma mensagem encontrada</strong>Tente outro termo ou categoria.';
    document.getElementById('grid').appendChild(e);
  } else if (visible > 0 && empty) {
    empty.remove();
  }
}

function toggleExpand(id) {
  if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
  const body = document.getElementById(`body-${id}`);
  const btn  = document.getElementById(`expbtn-${id}`);
  body?.classList.toggle('collapsed', !expanded.has(id));
  if (btn) btn.textContent = expanded.has(id) ? '▲ Recolher' : '▼ Ver mensagem completa';
}

function copyMsg(id) {
  const m = MESSAGES.find(x => x.id === id);
  if (!m) return;
  const text = resolveText(m);

  // Check unfilled vars
  const unfilled = m.vars.filter(v => {
    const val = (getFieldValues(id)[v.key] || '').trim();
    return !val;
  });

  if (unfilled.length > 0) {
    const labels = unfilled.map(v => v.label).join(', ');
    if (!confirm(`Atenção: os campos "${labels}" ainda estão em branco.\n\nCopiar assim mesmo?`)) return;
  }

  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(`copy-${id}`);
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copiado!`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copiar`;
    }, 2200);
  });
}

// Init
renderAll();

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value.toLowerCase().trim();
  applyFilters();
});

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  currentCat = btn.dataset.cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
  applyFilters();
});
</script>
</body>
</html>
